[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threshaudit"
version = "0.1.0"
description = "Audit whether a frozen, in-distribution-calibrated reliability threshold survives distribution shift."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mohammed Munir Uddin", email = "muniruddin514@outlook.com" }
]
keywords = [
    "machine learning",
    "uncertainty quantification",
    "selective prediction",
    "distribution shift",
    "reliability",
    "calibration",
]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.3"]
dev = ["pytest>=7.0", "pandas>=2.0", "scikit-learn>=1.3"]

[project.urls]
Homepage = "https://github.com/QuantumBoseBD1971/threshaudit"
Repository = "https://github.com/QuantumBoseBD1971/threshaudit"

[tool.setuptools.packages.find]
include = ["threshaudit*"]
